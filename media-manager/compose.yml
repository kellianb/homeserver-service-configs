services:
    gluetun:
        image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
        container_name: gluetun # Other stacks reach qbittorrent/flaresolverr/proxy through this name on aether-net
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        environment:
            - VPN_SERVICE_PROVIDER=protonvpn
            - VPN_TYPE=wireguard
            - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
            - SERVER_COUNTRIES=${SERVER_COUNTRIES}
            # Ports other containers on aether-net may reach (qbittorrent, flaresolverr, http proxy). Not published on the host.
            - FIREWALL_INPUT_PORTS=8080,8191,8888
            # HTTP proxy so Prowlarr can send indexer traffic through the VPN (use via an Indexer Proxy + tag)
            - HTTPPROXY=on
            - HTTPPROXY_USER=${HTTPPROXY_USER:?proxy user required}
            - HTTPPROXY_PASSWORD=${HTTPPROXY_PASSWORD:?proxy password required}
            - PORT_FORWARD_ONLY=on # only use servers that support forwarding
            - VPN_PORT_FORWARDING=on
            # Push the forwarded port into qBittorrent whenever it changes
            - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
            - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
        restart: unless-stopped
        networks:
            - aether-net
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=aether-net"

            # qbittorrent: HTTP redirect
            - "traefik.http.routers.qbittorrent.entrypoints=http"
            - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.kellian.cloud`)"
            - "traefik.http.middlewares.qbittorrent-https-redirect.redirectscheme.scheme=https"
            - "traefik.http.routers.qbittorrent.middlewares=qbittorrent-https-redirect"
            - "traefik.http.routers.qbittorrent.service=qbittorrent"

            # qbittorrent: HTTPS router
            - "traefik.http.routers.qbittorrent-secure.entrypoints=https"
            - "traefik.http.routers.qbittorrent-secure.rule=Host(`qbittorrent.kellian.cloud`)"
            - "traefik.http.routers.qbittorrent-secure.tls=true"
            - "traefik.http.routers.qbittorrent-secure.tls.certresolver=cloudflare"
            - "traefik.http.routers.qbittorrent-secure.middlewares=authentik-forward@file"
            - "traefik.http.routers.qbittorrent-secure.service=qbittorrent"

            - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"

    qbittorrent:
        image: ghcr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls486@sha256:05c1454f9a32967affc1f34f67f8cc0cc57dd805dca45489fe797095a6286556
        container_name: qbittorrent
        user: "1010:3500"
        restart: unless-stopped
        network_mode: "service:gluetun" # Everything goes through the VPN, no network of its own = kill switch
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        pids_limit: 512
        mem_limit: 4g
        depends_on:
            gluetun:
                condition: service_healthy
                restart: true
        environment:
            UMASK: "002"
            WEBUI_PORT: "8080"
            TORRENTING_PORT: "6881"
        tmpfs:
            - /run:uid=1010,gid=3500,exec
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /containers/volumes/qbittorrent:/config
            - /media/downloads:/media/downloads

    flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767

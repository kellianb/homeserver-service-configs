services:
    server:
        container_name: authentik-server
        user: "1001:3500"
        command: server
        environment:
            AUTHENTIK_POSTGRESQL__HOST: postgresql
            AUTHENTIK_POSTGRESQL__NAME: authentik
            AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/PG_AUTHENTIK_PASSWORD
            AUTHENTIK_POSTGRESQL__USER: file:///run/secrets/PG_AUTHENTIK_USER
            AUTHENTIK_SECRET_KEY: file:///run/secrets/AUTHENTIK_SECRET_KEY
        image: authentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
        networks:
            - aether-net
            - postgresql-net
        restart: unless-stopped
        shm_size: 512mb
        secrets:
            - PG_AUTHENTIK_USER
            - PG_AUTHENTIK_PASSWORD
            - AUTHENTIK_SECRET_KEY
        volumes:
            - /containers/volumes/authentik/data:/data
            - /containers/volumes/authentik/custom-templates:/templates
        labels:
            - "traefik.enable=true"

            # HTTP redirect
            - "traefik.http.routers.authentik.entrypoints=http"
            - "traefik.http.routers.authentik.rule=Host(`auth.kellian.cloud`)"
            - "traefik.http.middlewares.authentik-https-redirect.redirectscheme.scheme=https"
            - "traefik.http.routers.authentik.middlewares=authentik-https-redirect"

            # HTTPS router
            - "traefik.http.routers.authentik-secure.entrypoints=https"
            - "traefik.http.routers.authentik-secure.rule=Host(`auth.kellian.cloud`)"
            - "traefik.http.routers.authentik-secure.service=authentik"
            - "traefik.http.routers.authentik-secure.tls=true"
            - "traefik.http.routers.authentik-secure.tls.certresolver=cloudflare"

            # authentik internal port
            - "traefik.http.services.authentik.loadbalancer.server.port=9000"
            - "traefik.http.services.authentik.loadbalancer.server.scheme=http"

    worker:
        container_name: authentik-worker
        user: "1001:3500"
        command: worker
        networks:
            - postgresql-net
        environment:
            AUTHENTIK_POSTGRESQL__HOST: postgresql
            AUTHENTIK_POSTGRESQL__NAME: authentik
            AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/PG_AUTHENTIK_PASSWORD
            AUTHENTIK_POSTGRESQL__USER: file:///run/secrets/PG_AUTHENTIK_USER
            AUTHENTIK_SECRET_KEY: file:///run/secrets/AUTHENTIK_SECRET_KEY
        image: authentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
        restart: unless-stopped
        shm_size: 512mb
        secrets:
            - PG_AUTHENTIK_USER
            - PG_AUTHENTIK_PASSWORD
            - AUTHENTIK_SECRET_KEY
        volumes:
            - /containers/volumes/authentik/data:/data
            - /containers/volumes/authentik/certs:/certs
            - /containers/volumes/authentik/custom-templates:/templates

secrets:
    PG_AUTHENTIK_USER:
        file: "/containers/secrets/postgresql/authentik_user"
    PG_AUTHENTIK_PASSWORD:
        file: "/containers/secrets/postgresql/authentik_password"
    AUTHENTIK_SECRET_KEY:
        file: "/containers/secrets/authentik/secret_key"

networks:
    aether-net:
        external: true
    postgresql-net:
        external: true

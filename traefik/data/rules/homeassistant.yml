http:
    routers:
        homeassistant:
            rule: "Host(`home.kellian.cloud`)"
            service: homeassistant
            entryPoints:
                - http
            middlewares:
                - homeassistant-https-redirect

        homeassistant-secure:
            rule: "Host(`home.kellian.cloud`)"
            service: homeassistant
            tls:
                certresolver: "cloudflare"
            entryPoints:
                - https

    middlewares:
        homeassistant-https-redirect:
            redirectscheme:
                scheme: https
    services:
        homeassistant:
            loadBalancer:
                servers:
                    - url: "http://192.168.178.210:8123"

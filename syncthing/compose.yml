services:
    syncthing:
        image: syncthing/syncthing:2.0.16@sha256:4a961394ca471f4e48f31ad2cef50697e502c8799e2e98477a1c3844e0c5bc54
        container_name: syncthing
        hostname: pve01-portainer-syncthing
        environment:
            - PUID=1005
            - PGID=3500
        volumes:
            - /documents:/documents
            - /containers/volumes/syncthing:/var/syncthing
        network_mode: host
        restart: unless-stopped
        user: "1005:3500"
        healthcheck:
            test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
            interval: 1m
            timeout: 10s
            retries: 3

networks:
    aether-net:
        external: true

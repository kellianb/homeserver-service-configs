services:
    postgresql:
        container_name: postgresql
        user: "1013:3500"
        read_only: true
        tmpfs:
            - /tmp
            - /run/postgresql:uid=1013,gid=3500,mode=0755
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    memory: 4g
                    pids: 512
        environment:
            POSTGRES_USER_FILE: /run/secrets/PG_ADMIN_USER
            POSTGRES_PASSWORD_FILE: /run/secrets/PG_ADMIN_PASSWORD
        secrets:
            - PG_ADMIN_USER
            - PG_ADMIN_PASSWORD
            - PG_AUTHENTIK_USER
            - PG_AUTHENTIK_PASSWORD
        healthcheck:
            interval: 30s
            retries: 5
            start_period: 20s
            test:
                - CMD-SHELL
                - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
            timeout: 5s
        image: docker.io/library/postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        restart: unless-stopped
        networks:
            - postgresql-net
        volumes:
            - /containers/volumes/postgresql:/var/lib/postgresql/data
            - ./init:/docker-entrypoint-initdb.d/:ro

secrets:
    # PostgreSQL
    PG_ADMIN_USER:
        file: "/containers/secrets/postgresql/admin_user"
    PG_ADMIN_PASSWORD:
        file: "/containers/secrets/postgresql/admin_password"
    # Authentik
    PG_AUTHENTIK_USER:
        file: "/containers/secrets/postgresql/authentik_user"
    PG_AUTHENTIK_PASSWORD:
        file: "/containers/secrets/postgresql/authentik_password"

networks:
    postgresql-net:
        name: postgresql-net

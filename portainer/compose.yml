services:
    portainer:
        container_name: portainer
        image: portainer/portainer-ce:2.45.4-alpine@sha256:15f6680e9c3260154684343566df3c168956e352a8cca8a50bcd81ce31df0143
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /containers/volumes/portainer:/data
        ports:
            - 9443:9443
            - 8000:8000 # Remove if you do not intend to use Edge Agents

networks:
    default:
        name: portainer_network

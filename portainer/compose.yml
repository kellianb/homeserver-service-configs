services:
    portainer:
        container_name: portainer
        image: portainer/portainer-ce:sts@sha256:3609c307943bca8e5c492f69ddd6965df177208b50678a4cff28391c8dd4e96e
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /containers/volumes/portainer:/data
        ports:
            - 9443:9443
            - 8000:8000 # Remove if you do not intend to use Edge Agents

networks:
    default:
        name: portainer_network

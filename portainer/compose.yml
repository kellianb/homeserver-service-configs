services:
    portainer:
        container_name: portainer
        image: portainer/portainer-ce:sts@sha256:18616fff2998f8ca0e8ebe7f028658ae1682859cf43f212f81a849c1093ad639
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /containers/volumes/portainer:/data
        ports:
            - 9443:9443
            - 8000:8000 # Remove if you do not intend to use Edge Agents

networks:
    default:
        name: portainer_network
